<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iraj Shahzad</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310131a'/%3E%3Ctext x='32' y='42' font-family='monospace' font-weight='bold' font-size='26' fill='%23e7a94c' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10131a;
    --panel: #171b24;
    --panel-border: #2a2f3d;
    --row-hover: #1f2430;
    --text: #eceae2;
    --muted: #7d8194;
    --amber: #e7a94c;
    --mint: #6ee7b7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(231, 169, 76, 0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(110, 231, 183, 0.04), transparent 40%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .terminal {
    width: 100%;
    max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #12151d;
    border-bottom: 1px solid var(--panel-border);
  }

  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.red { background: #e5726c; }
  .dot.yellow { background: #e7c26c; }
  .dot.green { background: #6ee7ab; }

  .filename {
    margin-left: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .content { padding: 28px 26px 24px; }

  .prompt {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--mint);
    margin-bottom: 4px;
  }

  .prompt span.path { color: var(--muted); }

  .name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 700;
    margin-top: 10px;
    letter-spacing: -0.02em;
  }

  .role {
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
    margin-bottom: 24px;
  }

  .rule {
    height: 1px;
    background: var(--panel-border);
    margin: 0 0 6px;
  }

  .links { display: flex; flex-direction: column; }

  .links a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    color: var(--text);
    padding: 13px 4px;
    border-bottom: 1px solid var(--panel-border);
    font-size: 15px;
    transition: background 0.15s ease, padding-left 0.15s ease;
    border-radius: 6px;
  }

  .links a:last-child { border-bottom: none; }

  .links a:hover {
    background: var(--row-hover);
    padding-left: 10px;
  }

  .links a .label {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    flex: 1 1 auto;
  }

  .links a .chev {
    font-family: 'JetBrains Mono', monospace;
    color: var(--amber);
    font-size: 13px;
    flex: 0 0 auto;
  }

  .links a .path-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    flex: 0 0 auto;
    white-space: nowrap;
    margin-left: 10px;
  }

  .status {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .status .pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 0 0 rgba(110, 231, 183, 0.6);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(110, 231, 183, 0.5); }
    70% { box-shadow: 0 0 0 6px rgba(110, 231, 183, 0); }
    100% { box-shadow: 0 0 0 0 rgba(110, 231, 183, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .status .pulse { animation: none; }
  }

  a:focus-visible, .links a:focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 2px;
  }

  .blurb {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
    margin: -14px 0 20px;
    padding-left: 4px;
    border-left: 2px solid var(--panel-border);
    padding-left: 10px;
  }

  @media (max-width: 380px) {
    body { padding: 14px; }
    .content { padding: 22px 18px 20px; }
    .name { font-size: 22px; }
    .links a { font-size: 14px; padding: 12px 2px; }
  }

  @media (min-width: 700px) {
    .terminal { max-width: 480px; }
  }
</style>
</head>
<body>

  <div class="terminal">
    <div class="titlebar">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <div class="filename">profile.sh</div>
    </div>

    <div class="content">
      <div class="prompt"><span class="path">BSCS 2022-2026 %</span> echo "compiled successfully"</div>
      <div class="name">Iraj Shahzad</div>
      <div class="role">Computer Science Graduate</div>

      <div class="links">
        <a href="https://github.com/Iraj-Shahzad/Memory-Care" target="_blank" rel="noopener">
          <span class="label"><span class="chev">&gt;</span> FYP: Memory Care</span>
          <span class="path-hint">/code</span>
        </a>
        <a href="https://iraj-shahzad.github.io/demo.mp4" target="_blank" rel="noopener">
          <span class="label"><span class="chev">&gt;</span> Demo Video</span>
          <span class="path-hint">/mp4</span>
        </a>
        <a href="https://iraj-shahzad.github.io/MemoryCare-IrajShahzadFYP.pptx" target="_blank" rel="noopener">
          <span class="label"><span class="chev">&gt;</span> Slides</span>
          <span class="path-hint">/pptx</span>
        </a>
        <a href="https://github.com/Iraj-Shahzad" target="_blank" rel="noopener">
          <span class="label"><span class="chev">&gt;</span> GitHub</span>
          <span class="path-hint">/repos</span>
        </a>
        <a href="https://www.linkedin.com/in/iraj-shahzad/" target="_blank" rel="noopener">
          <span class="label"><span class="chev">&gt;</span> LinkedIn</span>
          <span class="path-hint">/profile</span>
        </a>
        <a href="irajresume.pdf" target="_blank" rel="noopener">
          <span class="label"><span class="chev">&gt;</span> Resume</span>
          <span class="path-hint">/pdf</span>
        </a>
        <a href="mailto:irajshhzad@gmail.com">
          <span class="label"><span class="chev">&gt;</span> Contact</span>
          <span class="path-hint">/mail</span>
        </a>
      </div>

      <div class="status">
        <span class="pulse"></span>
        open to opportunities
      </div>
    </div>
  </div>

</body>
</html>
